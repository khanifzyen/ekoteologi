name: CI

# Sprint 9 (migrasi PocketBase): job backend (lint JS + instance uji PocketBase + smoke)
# menggantikan job api (FastAPI). Job admin/mobile/android-apk tidak berubah.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — PocketBase lint, smoke & rules
    runs-on: ubuntu-latest
    env:
      PB_VERSION: 0.40.3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Sinkron versi pin (Makefile vs workflow)
        run: |
          grep -q "PB_VERSION := $PB_VERSION" Makefile
          grep -q "ARG PB_VERSION=$PB_VERSION" pocketbase/Dockerfile
          echo "pin OK: v$PB_VERSION"
      - name: Lint JS (hooks, migrations, scripts)
        run: |
          for f in pocketbase/pb_hooks/*.pb.js pocketbase/pb_migrations/*.js pocketbase/scripts/*.mjs; do
            node --check "$f"
          done
          echo "lint JS OK"
      - name: Unduh PocketBase v$PB_VERSION (versi pin)
        run: |
          curl -sL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -o /tmp/pb.zip -d pocketbase
          chmod +x pocketbase/pocketbase
          ./pocketbase/pocketbase --version
      - name: Test integrasi (migrasi, seed, API rules — instance uji sekali pakai)
        run: node pocketbase/scripts/test.mjs
      - name: E2E alur klien SDK (auth, profil, misi, verifikasi)
        run: node pocketbase/scripts/e2e-sdk.mjs
      - name: Smoke health + ping
        run: node pocketbase/scripts/smoke.mjs

  admin:
    name: Admin — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  mobile:
    name: Mobile — lint & build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile/dist/
          retention-days: 7

  android-apk:
    name: Mobile — APK debug
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build web assets
        run: |
          npm ci
          npm run build
      - name: Sinkronisasi Capacitor
        run: npx cap sync android
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
