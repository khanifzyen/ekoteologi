name: CI

# Sprint 0 — Fondasi Teknis: lint, test, build untuk api/admin/mobile + APK debug.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ekoteologi
          POSTGRES_PASSWORD: ekoteologi
          POSTGRES_DB: ekoteologi_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ekoteologi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ekoteologi:ekoteologi@localhost:55432/ekoteologi_test
      REDIS_URL: redis://localhost:56379/0
    steps:
      - uses: actions/checkout@v5
      - name: Pasang uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12
      - name: Sinkronisasi dependensi
        run: uv sync --locked
      - name: Lint (ruff check + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (pytest)
        run: uv run pytest -q

  admin:
    name: Admin — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile — lint & build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile/dist/
          retention-days: 7

  android-apk:
    name: Mobile — APK debug
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build web assets
        run: |
          npm ci
          npm run build
      - name: Sinkronisasi Capacitor
        run: npx cap sync android
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
