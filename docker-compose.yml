# Layanan infrastruktur lokal (Sprint 0 — implementation-plan §4).
# Jalankan: docker compose up -d
# API & admin dijalankan langsung di host (uv / npm) untuk hot-reload.
#
# Catatan port host: 5432/6379 dipetakan ke 55432/56379 agar tidak
# bentrok dgn Postgres/Redis yang sudah berjalan di mesin dev ini.
services:
  db:
    image: postgres:16-alpine
    container_name: ekoteologi-db
    environment:
      POSTGRES_USER: ekoteologi
      POSTGRES_PASSWORD: ekoteologi
      POSTGRES_DB: ekoteologi
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekoteologi -d ekoteologi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ekoteologi-redis
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
