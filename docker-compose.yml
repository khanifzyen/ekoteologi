# Layanan infrastruktur lokal (Sprint 9 — backend PocketBase).
# Jalankan: docker compose up -d   → PocketBase di http://localhost:56180 (dashboard /_/)
#
# Admin & mobile tetap dijalankan langsung di host (npm) untuk hot-reload.
# Port host 56180 sengaja menghindari 8090 yang sering terpakai; ubah di bawah bila perlu.
#
# Superuser dibuat otomatis saat container start dari env berikut (ganti di produksi!).
services:
  pocketbase:
    build: ./pocketbase
    image: ekoteologi-pocketbase:0.40.3
    container_name: ekoteologi-pocketbase
    environment:
      PB_SUPERUSER_EMAIL: admin@ekoteologi.id
      PB_SUPERUSER_PASSWORD: ekoteologi123
      EKO_APP_VERSION: 0.1.0-sprint9
    ports:
      - "56180:8090"
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped

volumes:
  pb_data:
